name: CI/CD — CryptoX

on:
  push:
    branches: [ main, develop, "feature/**", "ci/**" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & upload Debug APK
  # ─────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Rename APK → CryptoX-debug.apk
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
             artifacts/CryptoX-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoX-debug
          path: artifacts/CryptoX-debug.apk
          retention-days: 14

  # ─────────────────────────────────────────────
  # 2. Run unit tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :feature:market:testDebugUnitTest :feature:detail:testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Build & upload Release APK  (tags only)
  # ─────────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK → CryptoX-<version>.apk
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
             "artifacts/CryptoX-${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoX-${{ steps.version.outputs.VERSION }}
          path: artifacts/CryptoX-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "CryptoX ${{ steps.version.outputs.VERSION }}"
          body: |
            ## CryptoX ${{ steps.version.outputs.VERSION }}

            ### Download
            Grab the APK below and install it on any Android device (min SDK 24).

            > **Note:** This is an unsigned release build.
            > Enable *"Install from unknown sources"* in your device settings.
          files: artifacts/CryptoX-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
